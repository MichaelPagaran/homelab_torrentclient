services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:${QBT_VERSION:-latest}
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - WEBUI_PORT=${WEBUI_PORT:-8080}
      - TORRENTING_PORT=${TORRENTING_PORT:-6881}
    volumes:
      - ${CONFIG_PATH:-./config}:/config
      - ${DOWNLOADS_PATH:?DOWNLOADS_PATH must be set in .env}:/downloads
    ports:
      - "${WEBUI_PORT:-8080}:${WEBUI_PORT:-8080}"
      - "${TORRENTING_PORT:-6881}:${TORRENTING_PORT:-6881}/tcp"
      - "${TORRENTING_PORT:-6881}:${TORRENTING_PORT:-6881}/udp"
